name: No Breach Web CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nobreach-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production acceptance

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NOBREACH_E2E_PORT: "4177"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: npm run test:e2e:run
